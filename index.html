<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1a17" />
    <title>果园小食光</title>
    <link rel="icon" type="image/png" href="assets/apple.png" />
    <style>
      /* 竖屏舞台：把游戏锁在竖屏比例内，桌面端居中留边，手机竖屏时自动铺满 */
      :root {
        color-scheme: dark;
        --stage-ratio: 0.46;      /* 宽 / 高，约等于 9 : 19.5 的手机竖屏 */
        --stage-max-w: 430px;     /* 桌面端最大展示宽度 */
        --stage-max-h: 935px;     /* 与上面的宽度保持同一比例 */
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; margin: 0; }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 0%, #1d4a3f 0%, #132e29 45%, #0a1614 100%);
        font-family: 'ZhuoTeZiYouTi', 'Noto Sans SC', sans-serif;
        /* iOS 刘海 / 底部横条安全区 */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #142d2a;
        isolation: isolate;
      }

      .stage iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #142d2a;
        color-scheme: light;
      }

      /* 宽屏（桌面 / 平板 / 横屏）：收成手机竖屏的尺寸并居中 */
      @media (min-aspect-ratio: 3 / 5) {
        .stage {
          width: min(calc(100dvh * var(--stage-ratio)), var(--stage-max-w));
          height: min(100dvh, var(--stage-max-h));
          border-radius: 22px;
          box-shadow:
            0 26px 70px rgba(0, 0, 0, 0.55),
            0 0 0 1px rgba(255, 240, 205, 0.1),
            0 0 0 8px rgba(11, 26, 23, 0.55);
        }
      }

      /* 手机横屏：竖屏游戏不适合横着玩，提示旋转 */
      .rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        color: #fff6d8;
      }

      .rotate-hint svg { width: 68px; height: 68px; opacity: 0.9; }
      .rotate-hint b { font-size: 20px; letter-spacing: 2px; }
      .rotate-hint span { font-size: 12px; color: #b9d0a2; letter-spacing: 1px; }

      @media (orientation: landscape) and (max-height: 560px) and (pointer: coarse) {
        .stage { display: none; }
        .rotate-hint { display: grid; }
      }

      @media (prefers-reduced-motion: no-preference) {
        .stage { transition: width 0.18s ease, height 0.18s ease; }
      }
    </style>
  </head>
  <body>
    <!-- 游戏本体在 game.html 中；用 iframe 给它一个独立的竖屏视口，
         这样内部所有 vw / vh / 媒体查询都按竖屏计算，无需改动游戏代码 -->
    <div class="stage">
      <iframe
        src="game.html"
        title="果园小食光"
        allow="autoplay; fullscreen; gamepad"
        allowfullscreen
      ></iframe>
    </div>

    <div class="rotate-hint" role="status">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="15" y="6" width="18" height="30" rx="3" />
        <path d="M20 33h8" />
        <path d="M39 20a9 9 0 0 0-6-6.6" />
        <path d="M33 9.5V15h5.5" />
      </svg>
      <b>请旋转至竖屏</b>
      <span>本作按手机竖屏设计</span>
    </div>

    <noscript>
      <p style="position: fixed; inset: 0; display: grid; place-content: center; margin: 0; color: #fff6d8; font-size: 14px">
        需要开启 JavaScript 才能游玩，<a href="game.html" style="color: #f1c766">点此进入</a>
      </p>
    </noscript>
  </body>
</html>
